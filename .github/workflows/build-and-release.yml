name: Build and Release

on:
  push:
    branches: [main, develop]
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Build executable
        run: build.bat
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-ebook-maker-windows
          path: dist/pdf-ebook-maker.exe

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Build executable
        run: bash build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-ebook-maker-macos
          path: dist/pdf-ebook-maker

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxkbcommon-x11-0
          uv sync

      - name: Build executable
        run: bash build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-ebook-maker-linux
          path: dist/pdf-ebook-maker

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: pdf-ebook-maker-windows
          path: artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: pdf-ebook-maker-macos
          path: artifacts/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: pdf-ebook-maker-linux
          path: artifacts/linux

      - name: Rename artifacts
        run: |
          cp artifacts/windows/pdf-ebook-maker.exe pdf-ebook-maker-windows.exe
          cp artifacts/macos/pdf-ebook-maker pdf-ebook-maker-macos
          cp artifacts/linux/pdf-ebook-maker pdf-ebook-maker-linux

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pdf-ebook-maker-windows.exe
            pdf-ebook-maker-macos
            pdf-ebook-maker-linux
          generate_release_notes: true
          draft: true
