name: Build

on:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Build executable
        run: build.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-ebook-maker-windows
          path: dist/pdf-ebook-maker.exe
