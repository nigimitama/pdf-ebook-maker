[project]
name = "pdf-ebook-maker"
version = "0.1.0"
description = "A tool for processing images and creating PDF files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.3",
    "opencv-python>=4.13.0.92",
    "pillow>=12.1.1",
    "pyside6>=6.7",
    # OCR (ndlocr-lite)
    "onnxruntime>=1.19.0",
    "pyyaml>=6.0",
    "lxml>=5.0",
    "networkx>=3.0",
    "tqdm>=4.60",
    # PDF generation
    "reportlab>=4.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "ruff>=0.15.6",
]
