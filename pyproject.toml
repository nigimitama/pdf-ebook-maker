[project]
name = "pdf-ebook-maker"
version = "0.2.0"
description = "A tool for processing images and creating PDF files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.3",
    "opencv-python>=4.13.0.92",
    "pillow>=12.1.1",
    "pyside6>=6.7",
    # OCR (ndlocr-lite)
    "onnxruntime>=1.19.0",
    "pyyaml>=6.0",
    "lxml>=5.0",
    "networkx>=3.0",
    "tqdm>=4.60",
    # PDF generation
    "reportlab>=4.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "ruff>=0.15.6",
]

[tool.ruff]
# Third-party vendored OCR code — do not lint
exclude = [
    "src/ocr/ndl_parser.py",
    "src/ocr/parseq.py",
    "src/ocr/deim.py",
    "src/ocr/reading_order",
]

[tool.pyright]
pythonVersion = "3.12"
# Third-party vendored OCR code — do not type-check
ignore = [
    "src/ocr/ndl_parser.py",
    "src/ocr/parseq.py",
    "src/ocr/deim.py",
    "src/ocr/reading_order",
]
